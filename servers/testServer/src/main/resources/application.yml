server:
  port: 28703
spring:
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848  #nacos地址
        file-extension: yml   #文件后缀，可省略不配置
        namespace: fd400533-0988-4fcc-9be8-35b3b1c61451  #命名空间.省略不配置时，默认使用的public命名空间。配置时，指向nacos创建的命名空间。
        group: ${GROUP:DEFAULT_GROUP}
        prefix: ${spring.application.name}
        #file-extension: ${FILE_EXTENSION:yml}
      discovery:
        server-addr: localhost:8848 #配置nacos服务地址
        namespace: ${NAMESPACE:fd400533-0988-4fcc-9be8-35b3b1c61451}
  # 等价于@SpringBootApplication (exclude = {DataSourceAutoConfiguration.class})，但是此处前者不生效，后者生效，但是该配置具有更高的优先级。
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  application:
    name: testServer
    #连接超时时间（毫秒）
    timeout: 100000
  # 如果要使用dBhelp，必须配置该参数，否则报错 ，url' attribute is not specified and no embedded datasource could be configured
  datasource:
    druid:
      filter:
        slf4j:
          enable: true
      stat-view-servlet:
        # 是否启用StatViewServlet默认值true
        enabled: true
        # 访问路径为/druid时，跳转到StatViewServlet
        url-pattern: /druid/*
        # 是否能够重置数据
        reset-enable: false
#跨域配置
cors:
  #是否允许跨域请求
  AllowCors: true
  #允许跨域请求白名单,只有在AllowCors值为true的时候该配置生效
